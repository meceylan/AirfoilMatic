name: tests
on: [push, pull_request]
jobs:
  pytest:
    # Linux and Windows (the app is developed on Windows), each with the newest Streamlit that
    # requirements.txt allows and with its lowest one (streamlit==1.56.*).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        streamlit: ["latest", "lowest"]
        python: ["3.12"]
        include:
          # Streamlit Community Cloud runs Python 3.14 (app.py notes an import race seen there)
          - os: ubuntu-latest
            streamlit: latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - if: matrix.streamlit == 'lowest'
        run: pip install "streamlit==1.56.*"
      - run: python -m pytest -q
